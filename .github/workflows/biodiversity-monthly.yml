# Ejecución mensual del piloto de cifras de aves (GBIF -> ArcGIS Online).
#
# Este workflow es el "reloj" del Camino 3: ejecuta la extracción y la
# publicación una vez al mes, SIN depender de ningún PC personal.
#
# Seguridad:
#   - Las credenciales de ArcGIS se leen de GitHub *Secrets* (Settings >
#     Secrets and variables > Actions). NUNCA se escriben en el repositorio.
#   - El paquete `arcgis` se instala SOLO aquí (en el runner), no en el entorno
#     local de desarrollo.
#
# Antes de habilitarlo hay que:
#   1. Crear las dos tablas alojadas en ArcGIS Online (ver la guía de carga).
#   2. Definir los 5 secrets (abajo) con los datos de la cuenta de SAO.
# Mientras no existan los secrets, se puede lanzar en modo dry-run manual.

name: Cifras de aves (mensual)

on:
  schedule:
    # 06:00 UTC del día 1 de cada mes. Ajustable.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    # Permite lanzarlo manualmente desde la pestaña Actions.
    inputs:
      dry_run:
        description: "Ejecutar sin publicar en ArcGIS (solo extraer/exportar)"
        type: boolean
        default: true

permissions:
  contents: write  # para commitear el histórico/run_log actualizados

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia de publicación (solo en el runner)
        run: python -m pip install --upgrade pip arcgis

      - name: Ejecutar pipeline (extraer -> exportar -> publicar)
        env:
          ARCGIS_URL: ${{ secrets.ARCGIS_URL }}
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          ARCGIS_NATIONAL_TABLE_ID: ${{ secrets.ARCGIS_NATIONAL_TABLE_ID }}
          ARCGIS_PUBLISHER_TABLE_ID: ${{ secrets.ARCGIS_PUBLISHER_TABLE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/biodiversity_pilot/publish_to_arcgis.py --dry-run
          else
            python scripts/biodiversity_pilot/publish_to_arcgis.py
          fi

      - name: Guardar histórico y registro de ejecuciones
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/biodiversity_pilot/gbif/history outputs/biodiversity_pilot/gbif/arcgis/run_log.csv outputs/biodiversity_pilot/gbif/bird_record_counts_*.* || true
          git commit -m "chore(biodiversity): corte mensual de cifras de aves [skip ci]" || echo "Sin cambios que commitear"
          git push || echo "Nada que empujar"
